<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--mute:#5a6a85;--navy:#1c3a6e;--teal:#1f7a8c;--amber:#d9731a;--line:#d5deea;--soft:#e8f0f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a30;--card:#16243f;--ink:#e9eff9;--mute:#9db0cc;--navy:#8fb2f0;--teal:#5cc0d3;--amber:#f0a45a;--line:#2a3c5e;--soft:#1c2d4d}}
:root[data-theme="dark"]{--bg:#0e1a30;--card:#16243f;--ink:#e9eff9;--mute:#9db0cc;--navy:#8fb2f0;--teal:#5cc0d3;--amber:#f0a45a;--line:#2a3c5e;--soft:#1c2d4d}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Newsreader,Georgia,serif}
main{max-width:640px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3,.sans,button,label.t{font-family:Lexend,system-ui,-apple-system,Segoe UI,sans-serif}
h1{font-size:2.3rem;line-height:1.1;margin:.6em 0 .2em;color:var(--navy);font-weight:600;letter-spacing:-.01em}
h2{font-size:1.4rem;line-height:1.25;margin:.3em 0 .6em;color:var(--navy);font-weight:600}
h3{font-size:1.05rem;margin:0 0 .3em;font-weight:600}
.grad{background:linear-gradient(90deg,var(--navy),var(--teal) 55%,var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:Lexend,sans-serif;font-size:1.15rem;font-weight:500;margin:0 0 1.2em}
.bar{height:5px;border-radius:3px;background:var(--line);margin:4px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--teal),var(--amber));transition:width .35s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.note{background:var(--soft);border-left:4px solid var(--amber);border-radius:6px;padding:12px 14px;margin:14px 0;font-size:.97rem}
p{margin:.6em 0}.mute{color:var(--mute);font-size:.93rem}
button{font-size:1rem;cursor:pointer;border-radius:12px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);padding:12px 16px;min-height:48px}
button.main{background:#1c3a6e;color:#fff;border-color:#1c3a6e}
button.main:hover{background:#244a8a}
@media (prefers-color-scheme:dark){button.main{border-color:#8fb2f0}}
button.opt{display:block;width:100%;text-align:left;margin:10px 0;background:var(--card);border-color:var(--line);color:var(--ink);line-height:1.4}
button.opt:hover,button.opt:focus-visible{border-color:var(--teal)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
textarea{width:100%;min-height:92px;font:inherit;font-size:1rem;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
label.t{display:block;font-size:.98rem;font-weight:500;margin:20px 0 4px}
label.t small{display:block;font:400 .9rem/1.45 Newsreader,serif;color:var(--mute);margin-top:2px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.tabs button{white-space:nowrap;min-height:40px;padding:8px 13px;font-size:.9rem}
.tabs button.on{background:#1c3a6e;color:#fff;border-color:#1c3a6e}
ul{padding-left:1.2em;margin:.4em 0}li{margin:.3em 0}
.foot a{color:var(--navy);font-weight:600}
.foot{margin-top:40px;font-size:.85rem;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
.chk{display:flex;gap:12px;align-items:flex-start;margin:10px 0;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;font-size:1rem;line-height:1.45;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--teal)}
.chk:has(input:checked){border-color:var(--teal);background:var(--soft)}
.art{display:block;width:min(250px,68%);margin:4px auto 0}
.grp{margin:26px 0 4px;color:var(--mute);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
button.opt b{display:block;font:600 1.02rem/1.3 Lexend,system-ui,sans-serif;color:var(--navy);margin-bottom:2px}
button.opt span{font-size:.95rem;color:var(--mute)}
details.card summary{cursor:pointer;font:600 1rem Lexend,system-ui,sans-serif;color:var(--navy);min-height:28px}
details.card[open] summary{margin-bottom:8px}
.tri{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.95rem;margin:10px 0}.tri span:nth-child(odd){font-weight:600}
</style>

const Q=[
['fog','What is making this hard to see clearly?',[['vortex','I keep replaying it. Feelings and assumptions are running the show.'],['cloud','I’m missing information, or too many things are tangled together.'],['both','Both at once.'],['none','Neither. I see it fairly clearly.']]],
['scope','How far does it reach?',[['self','Mostly me, something to work through on my own.'],['contained','One or a few other people.'],['system','It’s woven into policies, structures or the whole team.']]],
['time','How soon does something need to happen?',[['now','Now. Waiting will cost more than acting.'],['room','There’s room to think.']]],
['kind','Is this a difference with other people, a conflict within yourself, or both?',[['ext','A difference with other people.'],['int','A conflict within myself, such as whether what I’m doing still fits who I am.'],['both','Both.']]],
['influence','Can you realistically influence this?',[['yes','Yes.'],['maybe','Maybe, I’m not sure.'],['no','Honestly, no.']]],
['rel','Does this relationship or role matter to you going forward?',[['yes','Yes, I’ll still be here and so will they.'],['no','Not really.']]],
['age','Where is it in time?',[['new','Recent. It hasn’t hardened yet.'],['long','It’s been building for a while.'],['tried','I’ve already tried talking and it didn’t move.']]],
['engage','Is the other person likely to be willing to talk?',[['yes','Probably.'],['unsure','I don’t know.'],['no','No, they’ve shut things down before.']]],
['role','Whose situation is it?',[['mine','Mine.'],['helping','I’m helping someone else through theirs.']]],
['formal','Is a formal complaint, legal question or rights issue involved?',[['no','No.'],['yes','Yes, or possibly.']]]
];
const P={
walk:{name:'Walking Away',ch:'Chapter 9',blurb:'Stepping back on purpose. It can be the most self-aware move available, and it still has a cost worth naming.',items:[
['kind','Which kind of walking away is this?','Release (for good), pause (until there’s capacity), or survival (you don’t really have a choice). Name which, and why.'],
['inf','Can I influence this? Who pays if I try?','Include people who aren’t in the room: a colleague, a team, a relationship you’ll still need next year.'],
['cost','What does stepping back cost me?','Often it’s a say in what happens next. Is it a trade I’m choosing on purpose?'],
['say','If this affects others, what will I say?','Something honest and short, such as “This is what I need, and I can’t sort out the rest right now.”'],
['back','If it’s a pause, when and under what conditions do I return?','A pause has an end point. Without one it’s avoidance.'],
['next','My next step','One small, specific thing, and how I’ll know I’ve done it.']]},
light:{name:'Light Engagement',ch:'Chapter 10',blurb:'A brief, curious conversation, held early and honestly, before the moment sticks. This is the B BETTER half of B BETTER 2 B FREE.',items:[
['b','Breathe','What will I do to move from reflex to choice before I speak?'],
['bel','Believe positive intent','Where am I choosing to start from? What’s the most generous reading that could still be true?'],
['ex','Examine my emotions','What is running right now? Does it belong to this moment, or to something older?'],
['tim','Timing','Is now, here, and with these people the right moment? If not, when?'],
['oth','Think about what they may be experiencing','Don’t name it for them. Just hold open that they’re carrying something I can’t see.'],
['rant','The rant (the who)','Write the unfiltered version here. It isn\u2019t dishonest, just not ready.'],
['reframe','Reworded: the what and the how','Open with what, how or \u201ctell me about.\u201d Be wary of \u201cwhy\u201d and \u201cwho.\u201d The real test: is the question waiting for an answer?'],
['pos','A position I hold, reworded as an open question','A positional statement presents a conclusion as fact. “That won’t work” becomes “I’m worried about this option. What do you see?”'],
['end','My opening question, and where I want this to end up','What do I want this conversation to have done by the time it closes?'],
['next','My next step','One small, specific thing, and how I’ll know I’ve done it.']]},
snap:{name:'The Snapshot',ch:'Chapter 11',blurb:'Six quick questions for when time is short. A chosen decision beats a reactive one, as long as you come back to it.',items:[
['s1','What is happening here, stripped of the story I’m telling about it?',''],

const DT=`<details class="card"><summary>The Drama Triangle and the Empowerment Dynamic (Chapter 5)</summary><p>Under pressure most of us slip into a role without noticing, and the roles can shift within a single conversation. In the Drama Triangle (Stephen Karpman) they are the <b>victim</b>, who feels powerless; the <b>persecutor</b>, who blames or controls; and the <b>rescuer</b>, who over-helps or fixes without being asked. Many people arrive in the victim role, waiting for someone else to move.</p><p>David Emerald’s Empowerment Dynamic gives each role an active counterpart:</p><div class="tri"><span>Victim</span><span>becomes <b>Creator</b>: asks what I want to move toward.</span><span>Persecutor</span><span>becomes <b>Challenger</b>: names concerns and holds boundaries without shaming.</span><span>Rescuer</span><span>becomes <b>Coach</b>: supports through curiosity rather than taking over.</span></div><p class="mute">The movement is the same each time: from something happening to me, to something I’m choosing to do. You don’t have to escape a role to keep going. Seeing it is enough to start.</p></details>`;

const TK=`<details class="card"><summary>Who, or what and how?</summary><p>When we speak while still in the vortex, what comes out is the rant: too much, not neutral, aimed at the person rather than the problem. It often arrives as a <i>who</i> statement, about blame. The shift from “what happened” to “who is responsible” is one of the clearest signs the vortex is running the conversation.</p><p><b>The rant (who):</b> “You ask for input and then do what you had already decided. This is not how a good leader creates change.”</p><p><b>Reframed (what and how):</b> “It matters to us that we can contribute here. We’re not clear what happens to our input once we offer it. What would it take for us to work on this together?”</p><p class="mute">The rant isn’t the enemy. It’s where the who belongs. Get it out on paper, with someone you trust, or in your own head, so that by the time you speak to the other person, the what and the how are what remain.</p></details>
<details class="card"><summary>Positional statements</summary><p>A positional statement presents a conclusion as fact. Anyone trained to lead or carry expertise has likely learned to speak in positions without noticing. Decisiveness is rewarded, but speaking in positions often prevents clear thinking. Hold it open instead:</p><ul><li>“That will not work” shuts the door. “I’m worried about this option. What do others see?” holds it open.</li><li>“We must do it this way” ends the conversation. “This feels like the strongest option to me. How do others see it?” begins one.</li></ul></details>
<details class="card"><summary>Appreciative inquiry: tell me about…</summary><p>Come at someone’s experience with interest before you move to judgment or a solution. Ask <i>what</i>, <i>how</i> or <i>tell me about</i> rather than <i>why</i>, which tips easily into interrogation. Clarify before you conclude.</p></details>
<details class="card"><summary>The Curiosity Compass</summary><ul><li><b>Open with what:</b> What happened? What are your concerns? What would success look like here?</li><li><b>Open with how:</b> How do you see it? How has this affected you? How did you arrive at that conclusion?</li><li><b>Or invite:</b> Tell me more about that. Tell me about what matters most. Tell me about your experience.</li><li><b>Resist:</b> Why…? Who…? They can feel blaming. “What were you thinking…?” usually invites defensiveness.</li></ul><p class="mute">These aren’t forbidden words, just openings that tend to land badly.</p></details>
<details class="card"><summary>When the words aren’t the message</summary><p>“What’s with the hair?” opens with <i>what</i>, and it wasn’t curious at all: it came with a finger wag and a person already walking away. The first word is a weak signal. The reliable one is whether the question is waiting for an answer.</p><p>So before you ask anything, ask yourself whether you want to know. If you don’t, no opening word will hide it.</p><p>You can also hand curiosity back to someone who didn’t bring it: “Oh, you’re curious about my hair? I’d love to tell you the story sometime. What do you want to know?” Or, to someone who calls an answer stupid: “What would a smart move have looked like to you?” or “I want to think about this the way you do. What would you have said?” Nothing is named, no one is corrected, and everyone watching learns the move. Saying this to someone with power over you is frightening, so choose your moment.</p></details>
<details class="card"><summary>When the tone shifts</summary><p>When a conversation starts to escalate, the instinct is to match the energy or withdraw. Neither helps. Slow down. Don’t name other people’s emotions for them, however tempting. Invite instead: “I’m noticing something that feels important. Tell me what you’re feeling.”</p></details>
<details class="card"><summary>Check what they meant</summary><p>A two-word text, “Have fun,” was read in the worst possible voice and held on to for days. It had only ever meant what it said. We fill a message with a story, and the one we choose may not be the generous one. The repair is almost embarrassingly small: one curious question, asked in the moment. Check what someone meant before deciding what they meant.</p></details>
<details class="card"><summary>Conversation hints</summary><ul><li>Raise one or two things, not everything that’s wrong. Bring less than you think.</li><li>Ask where they are and what they can hold right now.</li><li>Open with: “What would make this meeting a success for you?”</li><li>Lead with the smallest true thing: “I’ve been thinking about what happened, and I wanted to talk with you about it.” Or: “I realize we may see this differently. I want to understand your perspective before I share mine.”</li><li>Name your limits: “Tell me if something doesn’t land well and I’ll reframe it.”</li><li>Prepare for emotion: what will I do if I feel overwhelmed or reactive?</li></ul><p class="mute">Am I listening to understand, or listening to respond?</p></details>`;

- Talk about the what and the how (what happened, how it affected me), not the who (blame, character, motives).
- Avoid positional statements: conclusions presented as facts, such as "That won't work" or "We must do it this way". Holding it open sounds like "I'm worried about this option. What do others see?"

- End with a question the person genuinely wants answered. The first word is only a weak signal; the real test is whether the question is waiting for an answer.

 else if(v==='nopath')h=`<p class="mute sans">Part 5: When there is no shared path</p><h2>When nothing moves</h2>
 <p>Sometimes you’ve done the thinking, tried the conversations, and the situation still doesn’t shift. That doesn’t always mean you did it wrong. The conditions for resolving it may not be there: the other person won’t engage, a leader listens and nothing changes, or the system isn’t ready. You can’t make another person engage or an organization ready.</p>

 <details class="card"><summary>Have I reached the end of the road, or stopped short?</summary><p>Before you decide that nothing will move, go back over the steps. Was there a conversation you never quite had, a question you never asked, or support you never went looking for? “Nothing moves” should be a conclusion, not the place you ran out of ideas.</p><div class="row"><button data-a="go" data-v="stuck">Where is the stuck coming from?</button></div></details>
 <details class="card"><summary>Am I working toward a conversation, or toward peace without one?</summary><p>These are different kinds of work and they ask different things of you. Which one are you doing right now?</p></details>
 <details class="card"><summary>When a door closes</summary><p>Every step teaches you something about the person or the organization you’re dealing with. A closed door is information, even if it isn’t the information you wanted. When the first heat has settled, two small questions can open things again: <i>What else?</i> and <i>What next?</i> Then ask what you want. Asked too early, that question tends to get answered by frustration.</p></details>

 <div class="row"><button class="main" data-a="start" data-v="light">Open the Light Engagement worksheet</button><button data-a="go" data-v="home">Back to home</button></div>`;
 else if(v==='vortex')h=bar(.2)+`<p class="mute sans">Chapter 3: When Thinking Breaks Down. Step outside the vortex first</p><h2>The vortex</h2>
 <p>The cloud is the situation. The vortex is what your mind builds around it, a loop that pulls your thinking inward. From inside, the centre feels still, which makes it hard to catch. Signs you’re in it: thoughts circling, a strong emotional charge, and trouble separating what happened from what you think it means.</p>
 <p class="mute">Name what’s spinning. Once you can see a sentence for what it is, you can test it.</p>${DT}${tip}${fld(PV)}
 <div class="card"><h3>Step out of the vortex: say it as what and how</h3><p>Look back at what you wrote above. Which statements are about <b>who</b> someone is, or what they meant? Pick one or two and restate them as <b>what and how is happening</b>, as if for someone who doesn’t know the story. Try <i>what</i>, <i>how</i> and <i>tell me about</i>.</p><p style="color:#1f2a44">For example, “She’s disrespectful” becomes “In meetings my input is often skipped, and I’m not sure why.”</p>${fld([['vw','A statement that is about a person',''],['vr','The same statement as what and how is happening','']])}</div>
 ${refBtn('vortex')}
 <div class="row"><button class="main" data-a="vnext">The vortex feels looser. Continue</button><button data-a="go" data-v="rest">Still spinning: pause for now</button><button data-a="back">Back</button></div>`;
 else if(v==='cloud')h=bar(.3)+`<p class="mute sans">Chapter 3: When Thinking Breaks Down. Then work through the cloud</p><h2>The cloud</h2>
 <p>The situation itself can arrive as a dark, layered cloud: what happened, what was said, what was meant, the history, the stakes, all in the same space. Some pieces are missing and some pull in opposite directions. The work isn’t to solve the puzzle from inside the cloud. It’s to let the pieces fall out one at a time, so you can see each one.</p>
 <p>The pieces sit at different distances from you. Some are just about you. Some involve one or two other people. Some belong to a team or an organization, and some sit in the wider system. Sorting the pieces by who they touch shows which ones you can act on yourself and which need others. The book maps this in Chapter 7 (<i>What Kind of Situation Is This?</i>) and, for who is involved, in Step 5 of the Roadmap in Chapter 12.</p>${tip}${fld(PC)}${refBtn('cloud')}
 <div class="row"><button class="main" data-a="cnext">Continue</button><button data-a="back">Back</button></div>`;
 else if(v==='sit')h=bar(.05)+`<h2>In a sentence or two, what is this about?</h2><p class="mute">The neutral headline a stranger could understand. For example: “A colleague and I have stopped speaking, and I don’t know how to work through it.”</p>
 <textarea id="sit" aria-label="Situation">${esc(S.sit)}</textarea>
 <div class="row"><button class="main" data-a="sitgo">Continue</button><button data-a="back">Back</button></div>`;
 else if(v==='q'){const q=Q[S.q];h=bar(.1+.7*S.q/Q.length)+`<p class="mute sans">Question ${S.q+1} of ${Q.length}</p><h2>${q[1]}</h2>`+q[2].map(o=>`<button class="opt" data-a="ans" data-v="${o[0]}">${o[1]}</button>`).join('')+`<div class="row"><button data-a="back">Back</button></div>`}
 else if(v==='res'){const r=S.r,m=P[r.main],al=P[r.alt];
  h=bar(.85)+`<p class="mute sans">What fits right now</p><h2>${m.name}</h2><p>${m.blurb} <span class="mute">(${m.ch})</span></p>
  <div class="card"><h3>Why this one</h3><ul>${r.why.map(x=>`<li>${x}</li>`).join('')}</ul></div>`+
  r.fl.map(x=>`<div class="note">${x}</div>`).join('')+
  `<p class="mute">If it doesn’t feel right, the runner-up is <b>${al.name}</b>. You can also move between pathways as things shift.</p>
  <div class="row"><button class="main" data-a="start" data-v="${r.main}">Work through ${m.name}</button><button data-a="start" data-v="${r.alt}">Try ${al.name}</button></div>`;}
 else if(v==='work'){const p=P[S.path];
  h=bar(.92)+`<div class="tabs" role="tablist">`+Object.keys(P).map(k=>`<button class="${k===S.path?'on':''}" data-a="start" data-v="${k}">${P[k].name}</button>`).join('')+`</div>
  <h2>${p.name}</h2><p class="mute">${p.blurb}</p><p class="mute" style="color:#1f2a44">This pathway is ${p.ch} of <i>When We Get Stuck</i>, where it goes much deeper.</p>${S.path==='walk'?walkPick():''}${tip}`+
  p.items.map(i=>`<label class="t" for="f_${i[0]}">${i[1]}${i[2]?`<small>${i[2]}</small>`:''}</label><textarea id="f_${i[0]}" data-f="${S.path}_${i[0]}">${esc(S.n[S.path+'_'+i[0]]||'')}</textarea>`).join('')+
  `<div class="row"><button class="main" data-a="sum">See my summary</button><button data-a="go" data-v="stuck">Still finding this tough?</button><button data-a="back">Back</button></div>`;}
 else if(v==='sum'){const t=summary();
  h=bar(1)+`<h2>Your at-a-glance summary</h2><p class="mute">Your next step comes first, because it’s what keeps you grounded. The map tells you what you’re dealing with. The next step lets you move.</p>
  <textarea id="sumtxt" readonly style="min-height:300px" aria-label="Summary">${esc(t)}</textarea>
  ${DL?'<p class="mute">The PDF is created on your device, and this page sends nothing anywhere. It will contain whatever you typed, so treat it as confidential. If you upload it to an AI tool, check that tool’s privacy settings first and remove names and identifying details.</p>':'<p class="mute">Copy your summary and paste it into your notes, an email to yourself, or a document. It contains whatever you typed, so treat it as confidential. If you paste it into an AI tool, check that tool’s privacy settings first and remove names and identifying details.</p>'}
  <div class="row">${DL?'<button class="main" data-a="pdf">Save as PDF</button><button data-a="copy">Copy summary</button>':'<button class="main" data-a="copy">Copy summary</button>'}<button data-a="start" data-v="${S.path}">Edit answers</button></div>
  <div class="card"><h3>If it still won’t move</h3><p>Ask two questions: <b>What else?</b> and <b>What next?</b> Check that you’ve reached the end of the road rather than stopped short of it. If the conditions for resolution truly aren’t there, the work shifts from changing the situation to deciding how you’ll stand within it. For anything large, or any step you can’t get past, a coach, mediator or facilitator is a reasonable next move.</p></div>
  <div class="row"><button data-a="go" data-v="stuck">Where am I still stuck?</button><button data-a="reset">Start over with a new situation</button></div>`;}
 h+=`<p class="foot">Based on the book <i>When We Get Stuck: From Conflict to Clarity</i> by Dr. Amanda J. Brisebois, MD${v==='sum'?`, <a href="https://a.co/d/0cc128qf" target="_blank" rel="noopener noreferrer">available on Amazon</a>`:''}. Built with the help of Claude. Feedback or questions: <a href="mailto:coaching@amandabriseboismd.ca">coaching@amandabriseboismd.ca</a>. This guide is a thinking aid, not professional, legal, medical or mental health advice, and it doesn’t replace your own decisions.</p>`;
 app.innerHTML=h;window.scrollTo(0,0);S.msg='';{const sg=document.getElementById('sug');if(sg&&sg.scrollIntoView)sg.scrollIntoView({block:'center'})}
}
function summary(){
 const p=P[S.path],g=k=>(S.n[S.path+'_'+k]||'').trim();
 let t='NEXT STEP\n'+(g('next')||'(not yet written)')+'\n\nSITUATION\n'+(S.sit.trim()||'(not written)')+PRE.map(i=>{const x=(S.n['pre_'+i[0]]||'').trim();return x?'\n\n'+i[1].toUpperCase()+'\n'+x:''}).join('')+'\n\nPATHWAY: '+p.name+'\n';
 p.items.forEach(i=>{if(i[0]!=='next'&&g(i[0]))t+='\n'+i[1]+'\n'+g(i[0])+'\n'});
 return t;
}
async function makePdf(b){
 const t=summary().replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...');
 try{
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw 0;
  const d=new J({unit:'mm',format:'letter'}),w=d.internal.pageSize.getWidth(),h=d.internal.pageSize.getHeight(),m=18;let y=m;
  d.setFont('helvetica','bold');d.setFontSize(15);d.text('When We Get Stuck: my summary',m,y);y+=8;
  d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(100);d.text('A thinking aid, not professional, legal, medical or mental health advice. Decisions stay with you. Handle this file as confidential.',m,y,{maxWidth:w-2*m});y+=12;d.setTextColor(0);
  t.split('\n').forEach(l=>{const hd=l&&l===l.toUpperCase()&&/[A-Z]/.test(l);d.setFont('helvetica',hd?'bold':'normal');d.setFontSize(hd?10:11);
   d.splitTextToSize(l||' ',w-2*m).forEach(s=>{if(y>h-m){d.addPage();y=m}d.text(s,m,y);y+=hd?6:5.4})});
  const dl=window.claude&&await window.claude.use('downloads');if(!dl)throw 0;
  await dl.save({filename:'when-we-get-stuck-summary.pdf',data:d.output('arraybuffer')});
  b.textContent='Saved';
 }catch(e){b.textContent=e&&e.code==='declined'?'Not saved':'PDF not available here. Use Copy summary.'}
}
function save(){document.querySelectorAll('textarea[data-f]').forEach(e=>S.n[e.dataset.f]=e.value);document.querySelectorAll('input[data-c]').forEach(e=>S.c[e.dataset.c]=e.checked);const ak=document.getElementById('ack');if(ak)S.ok=ak.checked;const fk=document.getElementById('fbok');if(fk)S.fbok=fk.checked;const s=document.getElementById('sit');if(s)S.sit=s.value}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='ack')S.ok=e.target.checked});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,v=b.dataset.v;save();
 const goHome=m=>{S.hist=[];S.view='home';S.msg=m||''};
 const nav=(w,q)=>{S.sug=null;S.hist.push([S.view,S.q]);S.view=w;if(q!=null)S.q=q};
 if(a==='go'){if(v==='sit')S.g=true;nav(v)}
 else if(a==='wopen'){if(!S.ok){needOk();return}S.path='walk';S.wtype=v;const W=WT[v];if(W&&!(S.n.walk_kind||'').trim())S.n.walk_kind=W.n;nav('work')}
 else if(a==='wtype'){S.wtype=v;const W=WT[v];if(W&&(!(S.n.walk_kind||'').trim()||Object.values(WT).some(x=>x.n===S.n.walk_kind)))S.n.walk_kind=W.n}
 else if(a==='menu'){if(!S.ok){needOk();return}S.g=v==='guide';if(P[v]){S.path=v;nav('work')}else nav(v==='guide'?'storm':v)}
 else if(a==='capgo'){const n=p=>Object.keys(S.c).filter(k=>k[0]===p&&S.c[k]).length,sv=n('s');S.a.cap=sv>=2?'low':'ok';const rf=n('r');if(sv===0&&rf===0){document.getElementById('capmsg').hidden=false;return}if(sv>=3&&sv>rf)nav('rest');else if(sv>=1)nav('pause');else nav('ready')}
 else if(a==='proceed'){if(S.g)nav('sit');else nav('vortex')}
 else if(a==='decide'){S.g=true;S.a.fog='vortex';S.skip=1;if(!S.sit&&S.n.home_find)S.sit=S.n.home_find;nav('sit')}
 else if(a==='sitgo'){const k=S.skip;S.skip=0;nav('q',k?1:0)}
 else if(a==='ans'){const k=Q[S.q][0];S.a[k]=v;if(k==='fog')nav(v==='vortex'||v==='both'?'vortex':v==='cloud'?'cloud':'q',1);else if(S.q<Q.length-1)nav('q',S.q+1);else{S.r=rec(S.a);nav('res')}}
 else if(a==='vnext'){if(S.g)nav(S.a.fog==='both'?'cloud':'q');else nav('cloud')}
 else if(a==='cnext'){if(S.g)nav('q');else{S.g=true;S.skip=0;if(!S.sit&&S.n.home_find)S.sit=S.n.home_find;nav('sit')}}
 else if(a==='pdf'){makePdf(b);return}
 else if(a==='fb'){runFb(b);return}
 else if(a==='find'){if(!S.ok){needOk();return}const txt=v.split(',').map(i=>{const e=document.getElementById(i);return e?e.value:''}).join(' ');const r=route(txt);let s=r===null?'none':Array.isArray(r)?['crisis']:r;if(s!=='none'&&s[0]!=='crisis'&&v==='f_home_find'){const lx=txt.toLowerCase();if(/\b(fuck\w*|shit\w*|bullshit|bitch\w*|asshole\w*|bastard\w*|cunt\w*|dickhead\w*|prick|idiot\w*|moron\w*)\b/.test(lx))s='swear';else if(txt.trim().length>220||(txt.trim().match(/[.!?]+(\s|$)/g)||[]).length>2)s='long'}S.sug=s;S.sugAt=S.view}
 else if(a==='back'){const h=S.hist.pop();if(h){S.view=h[0];S.q=h[1]}else S.view='home'}
 else if(a==='start'){S.path=v;if(S.view!=='work')nav('work')}
 else if(a==='sum')S.view='sum';
 else if(a==='reset'){S.a={};S.n={};S.c={};S.sit='';S.hist=[];S.q=0;S.view='home'}
 else if(a==='copyref'){const q=refQ(v).map(([k,t])=>t+'\n'+((S.n[k]||'').trim()||'(left blank)')).join('\n\n');const t='My reflections. When We Get Stuck guide (based on the book by Dr. Amanda J. Brisebois)\n\n'+q+'\n';let ok=false;const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(x){}ta.remove();const good='Copied. Paste into your notes or an email',bad='Copying isn’t available here. Please select and copy the text yourself.';if(ok){b.textContent=good}else{try{navigator.clipboard.writeText(t).then(()=>{b.textContent=good},()=>{b.textContent=bad})}catch(x){b.textContent=bad}}return}
 else if(a==='copy'){const t=document.getElementById('sumtxt');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}try{navigator.clipboard.writeText(t.value).catch(()=>{});ok=true}catch(x){}b.textContent=ok?'Copied. Paste it into your notes, a document, or an email to yourself.':'Select the text above and copy it';return}
 else return;
 render();
});
render();
(async()=>{try{DL=window.claude?await window.claude.use('downloads'):null}catch(e){DL=null}if(DL&&S.view==='sum'){save();render()}})();
